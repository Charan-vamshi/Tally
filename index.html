<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tally Khata & Retail Billing POS • Login Gateway</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    };
  </script>
</head>
<body class="h-full bg-slate-900 text-slate-100 flex items-center justify-center font-sans antialiased p-4">

  <!-- Clean Login Card -->
  <div class="bg-slate-950 border border-slate-800 rounded-3xl max-w-md w-full p-8 shadow-2xl text-center space-y-6 relative overflow-hidden">
    
    <!-- Ambient Top Glow -->
    <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-emerald-500 via-purple-500 to-indigo-500"></div>

    <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-500 via-purple-600 to-indigo-600 flex items-center justify-center text-white mx-auto shadow-lg shadow-emerald-500/20">
      <i data-lucide="shield-check" class="w-9 h-9"></i>
    </div>

    <div>
      <h1 class="text-2xl font-black text-white tracking-tight">Tally Khata & POS</h1>
      <p class="text-xs text-slate-400 mt-1 font-medium">Multi-Tenant Retail Counter & Farmer Khata</p>
    </div>

    <!-- Error Box -->
    <div id="auth-error-box" class="hidden p-4 bg-rose-950/50 border border-rose-900 rounded-2xl text-xs text-rose-300 text-left space-y-1">
      <div class="flex items-center gap-1.5 font-bold text-rose-400">
        <i data-lucide="shield-alert" class="w-4 h-4"></i> Access Restricted
      </div>
      <p id="auth-error-msg">Your Gmail is not authorized. Only store admins authorized by Cherry can access.</p>
    </div>

    <!-- Google Sign-in Container -->
    <div class="pt-2 flex flex-col items-center justify-center space-y-4">
      <div id="g_id_onload"
           data-client_id="547580211224-v0sqogmckfo3sksg4l333sjbo921qiu5.apps.googleusercontent.com"
           data-context="signin"
           data-ux_mode="popup"
           data-callback="handleGoogleCredentialResponse"
           data-auto_prompt="false">
      </div>

      <div class="g_id_signin"
           data-type="standard"
           data-shape="pill"
           data-theme="outline"
           data-text="signin_with"
           data-size="large"
           data-logo_alignment="left">
      </div>

      <p class="text-[11px] text-slate-500 font-mono">Sign in with authorized Google account</p>
    </div>

    <div class="pt-4 border-t border-slate-900 text-[11px] text-slate-500 flex items-center justify-between">
      <span>₹0 Cloud Infrastructure</span>
      <span class="text-emerald-400 font-mono">Neon PostgreSQL • 24/7</span>
    </div>

  </div>

  <script src="/public/js/shared.js"></script>
  <script>
    function getUser() {
      try {
        const raw = sessionStorage.getItem('tally_user') || localStorage.getItem('tally_user');
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    function saveUser(user) {
      if (!user) return;
      sessionStorage.setItem('tally_user', JSON.stringify(user));
      localStorage.setItem('tally_user', JSON.stringify(user));
    }

    // 1. Auto-redirect if already logged in
    const existingUser = getUser();
    if (existingUser) {
      if (existingUser.role === 'OWNER') {
        window.location.replace('/admin');
      } else {
        window.location.replace('/billing');
      }
    }

    function parseJwt(token) {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
      } catch (e) {
        return null;
      }
    }

    async function handleGoogleCredentialResponse(response) {
      if (!response || !response.credential) return;

      const payload = parseJwt(response.credential);
      const email = payload && payload.email ? payload.email.toLowerCase() : '';
      const name = payload && (payload.given_name || payload.name) ? (payload.given_name || payload.name) : 'User';
      const picture = payload && payload.picture ? payload.picture : '';

      try {
        const authRes = await fetch('/api/auth/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credential: response.credential, email })
        });
        const authData = await authRes.json();

        if (authData.authorized) {
          const userObj = {
            email: authData.email || email,
            vendorId: authData.vendorId || 0,
            name: authData.role === 'OWNER' ? 'Cherry' : (authData.name || name),
            role: authData.role, // 'OWNER' or 'MANAGER'
            picture: authData.picture || picture,
            shopName: authData.shopName || (authData.name ? `${authData.name}'s Store` : 'Store Counter'),
            tagline: authData.tagline || 'Retail & Khata Counter',
            gstin: authData.gstin || '',
            address: authData.address || '',
            phone: authData.phone || ''
          };
          saveUser(userObj);

          if (userObj.role === 'OWNER') {
            window.location.replace('/admin');
          } else {
            window.location.replace('/billing');
          }
        } else {
          showAuthError(`Access Restricted: ${authData.error || 'Your account is not authorized.'} Contact Cherry to obtain access.`);
        }
      } catch (err) {
        showAuthError('Connection error verifying Google login. Try again.');
      }
    }

    function showAuthError(msg) {
      document.getElementById('auth-error-box').classList.remove('hidden');
      document.getElementById('auth-error-msg').textContent = msg;
    }

    window.onload = () => {
      lucide.createIcons();
    };
  </script>
</body>
</html>
