<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cherry • Platform Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    };
  </script>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white flex flex-col font-sans transition-colors duration-200">

  <!-- Header -->
  <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-purple-600 text-white flex items-center justify-center font-bold shadow-sm">
          <i data-lucide="shield" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="font-bold text-base text-slate-900 dark:text-white leading-tight">Cherry • Platform Admin</h1>
          <p class="text-[11px] text-slate-500 dark:text-slate-400">Store Access & Vendor Management</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="toggleTheme()" class="p-2 text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 rounded-lg transition" title="Toggle Dark/Light Mode">
          <i data-lucide="sun-medium" class="w-4 h-4 hidden dark:block"></i>
          <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
        </button>
        <button onclick="logout()" class="px-3.5 py-1.5 text-xs font-semibold text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/50 border border-rose-200 dark:border-rose-900/50 rounded-xl transition flex items-center gap-1.5 cursor-pointer">
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Logout
        </button>
      </div>
    </div>
  </header>

  <!-- Main Body -->
  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-8 flex-1 w-full space-y-6">

    <!-- Authorize New Vendor Card -->
    <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm p-6 space-y-4">
      <div>
        <h2 class="text-base font-bold text-slate-900 dark:text-white">Authorize New Store Admin</h2>
        <p class="text-xs text-slate-500 dark:text-slate-400">Only authorized Gmail accounts are permitted through the Google login gateway.</p>
      </div>

      <form onsubmit="handleQuickAddVendor(event)" class="grid grid-cols-1 sm:grid-cols-12 gap-3 text-xs">
        <div class="sm:col-span-5">
          <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Vendor Gmail Address</label>
          <input type="email" id="quick-vendor-email" required placeholder="vendor@gmail.com" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-purple-500 transition text-sm">
        </div>
        <div class="sm:col-span-3">
          <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Admin Name</label>
          <input type="text" id="quick-vendor-name" placeholder="e.g. Ramesh" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-purple-500 transition text-sm">
        </div>
        <div class="sm:col-span-4">
          <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Shop / Business Name</label>
          <input type="text" id="quick-vendor-shop" placeholder="e.g. Ramesh Agro Agencies" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-purple-500 transition text-sm">
        </div>
        <div class="sm:col-span-12 flex justify-end pt-1">
          <button type="submit" class="px-5 py-2.5 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-xl transition text-xs flex items-center gap-1.5 shadow-sm shadow-purple-600/20 cursor-pointer">
            <i data-lucide="user-plus" class="w-4 h-4"></i>
            <span>Authorize & Grant Access</span>
          </button>
        </div>
      </form>
    </div>

    <!-- Active Authorized Store Admins List -->
    <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <h3 class="font-bold text-sm text-slate-900 dark:text-white">Active Store Admins</h3>
          <span id="owner-stat-vendors" class="text-xs font-mono font-bold px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300">0</span>
        </div>
        <span class="text-xs text-slate-400">Instant Access Control</span>
      </div>

      <div id="owner-vendor-list" class="divide-y divide-slate-100 dark:border-slate-800">
        <!-- Populated by JS -->
      </div>
    </div>

  </main>

  <script src="/public/js/shared.js"></script>
  <script>
    // Enforce Cherry Owner authentication
    const ownerUser = requireAuth('OWNER');

    async function loadOwnerVendors() {
      const container = document.getElementById('owner-vendor-list');
      const countEl = document.getElementById('owner-stat-vendors');
      container.innerHTML = '<p class="p-6 text-xs text-slate-400">Loading authorized store admins...</p>';

      try {
        const res = await fetch('/api/managers');
        const list = await res.json();
        countEl.textContent = list.length;

        if (list.length === 0) {
          container.innerHTML = `
            <div class="p-10 text-center text-slate-400 text-xs">
              <i data-lucide="users" class="w-8 h-8 mx-auto mb-2 opacity-40"></i>
              No store admins authorized yet. Add an admin above to grant them access.
            </div>
          `;
          lucide.createIcons();
          return;
        }

        container.innerHTML = '';
        list.forEach((v, index) => {
          const div = document.createElement('div');
          div.className = "p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-slate-50/50 dark:hover:bg-slate-800/30 transition";
          div.innerHTML = `
            <div class="flex items-start sm:items-center gap-3">
              <div class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 flex items-center justify-center font-mono font-bold text-xs shrink-0">
                #${index + 1}
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <span class="font-bold text-sm text-slate-900 dark:text-white">${v.shop_name || 'Agro Store'}</span>
                  <span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 font-semibold">Active</span>
                </div>
                <div class="flex items-center gap-3 text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                  <span class="font-medium text-slate-700 dark:text-slate-300">${v.name || 'Admin'}</span>
                  <span>&bull;</span>
                  <span class="font-mono">${v.email}</span>
                </div>
              </div>
            </div>

            <button onclick="handleRevokeVendor(${v.id}, '${v.name || v.email}')" class="self-end sm:self-center px-3 py-1.5 text-xs font-semibold text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/50 border border-rose-200 dark:border-rose-900/50 rounded-lg transition flex items-center gap-1 cursor-pointer">
              <i data-lucide="user-x" class="w-3.5 h-3.5"></i>
              <span>Revoke Access</span>
            </button>
          `;
          container.appendChild(div);
        });

        lucide.createIcons();
      } catch (err) {
        container.innerHTML = `<p class="p-6 text-xs text-rose-500">Failed to load vendors: ${err.message}</p>`;
      }
    }

    async function handleQuickAddVendor(e) {
      e.preventDefault();
      const email = document.getElementById('quick-vendor-email').value.trim();
      const name = document.getElementById('quick-vendor-name').value.trim() || 'Store Admin';
      const shop_name = document.getElementById('quick-vendor-shop').value.trim() || `${name}'s Store`;

      try {
        const res = await fetch('/api/managers', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, name, shop_name })
        });
        if (res.ok) {
          document.getElementById('quick-vendor-email').value = '';
          document.getElementById('quick-vendor-name').value = '';
          document.getElementById('quick-vendor-shop').value = '';
          loadOwnerVendors();
        } else {
          const err = await res.json();
          alert('Failed to authorize vendor: ' + (err.error || 'Server error'));
        }
      } catch (err) {
        alert('Network error authorizing vendor: ' + err.message);
      }
    }

    async function handleRevokeVendor(id, name) {
      if (!confirm(`Are you sure you want to revoke access for ${name}? They will immediately be locked out.`)) return;
      try {
        const res = await fetch(`/api/managers/${id}`, { method: 'DELETE' });
        if (res.ok) {
          loadOwnerVendors();
        } else {
          alert('Failed to revoke vendor');
        }
      } catch (err) {
        alert('Error revoking vendor: ' + err.message);
      }
    }

    window.onload = () => {
      lucide.createIcons();
      loadOwnerVendors();
    };
  </script>
</body>
</html>
